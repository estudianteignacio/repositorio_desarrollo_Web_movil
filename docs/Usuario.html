<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - S.A.I.L</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="S.A.I.L_transparente.png" alt="S.A.I.L Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="Nosotros.html">Empresa</a></li>
                <li><a href="login.html">Perfil</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main style="padding: 40px; text-align: center;">
        <h2>Perfil del Usuario</h2>
        <div id="datos-usuario" style="margin-top: 20px; font-size: 1.2rem;">
            <!-- Los datos se cargarán dinámicamente con JS -->
        </div>
        <br>
        <a href="index.html" class="btn">Volver al Inicio</a>
    </main>

    <footer>
        <p>&copy; 2024 S.A.I.L - Todos los derechos reservados.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const usuarioGuardado = localStorage.getItem("usuario_sail");
            const contenedor = document.getElementById("datos-usuario");

            if (usuarioGuardado) {
                const usuario = JSON.parse(usuarioGuardado);
                contenedor.innerHTML = `
                    <p><strong>Nombre de Usuario:</strong> ${usuario.username}</p>
                    <p><strong>Correo Electrónico:</strong> ${usuario.email}</p>
                `;
            } else {
                contenedor.innerHTML = `<p>No hay datos de sesión guardados. Por favor, <a href="login.html">Inicia Sesión</a>.</p>`;
            }
        });
    </script>
</body>
</html>
