<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.I.L - Productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="S.A.I.L_transparente.png" alt="S.A.I.L Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="Nosotros.html">Empresa</a></li>
                <li><a href="login.html">Perfil</a></li>
                <li><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <section class="productos">
        <h2>Nuestros Productos</h2>
        <div class="grid-productos">
            <div class="producto">
                <img src="Johnnie-Walker-Red-Label-1L.jpg" alt="Whisky Johnnie Walker Red Label">
                <h3>Johnnie Walker Red Label</h3>
                <p>1 Litro</p>
                <span class="precio">$20.000</span>
                <button class="btn">Añadir al Carrito</button>
            </div>
            <div class="producto">
                <img src="Vodka-Absolut-Blue-750ml.jpeg" alt="Vodka Absolut Blue">
                <h3>Vodka Absolut Blue</h3>
                <p>750 ml</p>
                <span class="precio">$12.000</span>
                <button class="btn">Añadir al Carrito</button>
            </div>
            <div class="producto">
                <img src="pack pisco mistral + coca cola sin azucar 1.5 lts.png" alt="Pack Pisco Mistral + Coca Cola">
                <h3>Pack Pisco Mistral + Coca Cola</h3>
                <p>35° 750ml + Coca Cola Sin Azúcar 1.5L</p>
                <span class="precio">$15.000</span>
                <button class="btn">Añadir al Carrito</button>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 S.A.I.L - Todos los derechos reservados.</p>
    </footer>
