<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container-fluid mt-3">
  <h1>Three equal width columns</h1>
  <p>Note: Try to help add a new div with class="col" inside the row class - this will create four equal-width columns.</p>
  <div class="col-md-4 bg-white p-2 rounded text-dark">
      <h2 style="letter-spacing: 1px;">
         <class="mb-1">Desarrollo Web</h2>
         <h4 class="mb-0 fw-light">Clase Profesor Vivanco</h4>
  </div>
  <div class="row">
    
    <div class="col p-3 bg-primary text-white">.col</div>
    <div class="col p-3 bg-dark text-white">.col</div>
    <div class="col p-3 bg-warning text-white">.col</div>
  </div>
  <div class="row">
    <div class="col p-3 bg-secondary text-white">.col</div>
    <div class="col p-3 bg-dark text-white">.col</div>
    <div class="col p-3 bg-primary text-white">.col</div>
  </div>
  <div class="row">
    <div class="col p-3 bg-secondary text-white">.col</div>
    <div class="col p-3 bg-primary text-white">.col</div>
  </div>
    <p>Preuba de texto.</p>
</div>

</body>
</html>
